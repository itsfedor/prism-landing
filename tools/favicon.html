<!doctype html>
<html>
<head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:#05060E}
  .icon{
    width:512px;height:512px;border-radius:114px;position:relative;overflow:hidden;
    background:
      radial-gradient(120% 110% at 22% 12%, #2A2470 0%, #16143F 40%, #0C0C26 72%, #080818 100%);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.22), inset 0 -6px 24px rgba(0,0,0,.55);
    display:flex;align-items:center;justify-content:center;
  }
  .icon::after{
    content:"";position:absolute;inset:0;border-radius:inherit;
    background:radial-gradient(90% 70% at 50% 110%, rgba(110,91,255,.5), transparent 62%);
    pointer-events:none;
  }
  svg{width:344px;height:324px;position:relative;z-index:1;filter:drop-shadow(0 14px 34px rgba(0,0,0,.5))}
</style></head>
<body>
  <div class="icon">
    <svg viewBox="0 0 34 32" fill="none">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="rgba(255,255,255,.5)"/>
          <stop offset="1" stop-color="rgba(255,255,255,.10)"/>
        </linearGradient>
      </defs>
      <path d="M0 19h12" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M16.5 6.5 28 27H5Z" fill="url(#g)" stroke="rgba(255,255,255,.95)" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M22.3 16.8 33 12.6" stroke="#6E5BFF" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M24.1 19.6 33 17.4" stroke="#2BD9C7" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M25.9 22.4 33 22.2" stroke="#FF6B8A" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M26.5 24.6 32.6 26.4" stroke="#FFB43A" stroke-width="2.4" stroke-linecap="round" opacity=".9"/>
    </svg>
  </div>
</body>
</html>
